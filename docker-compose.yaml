services:
  mysql_db:
    image: mysql:8.0
    container_name: CoderPush_DB
    environment:
      MYSQL_DATABASE: coderpush_db
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uadmin", "-padmin" ]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
